name: macOS unsigned

# Compiles the native Mac app and runs BarkMacCore tests.
# No secrets, no match, no TestFlight, and no production notification.

on:
  pull_request:
    paths:
      - "BarkMac/**"
      - ".github/workflows/macos-unsigned.yml"
  push:
    branches:
      - master
    paths:
      - "BarkMac/**"
      - ".github/workflows/macos-unsigned.yml"

permissions:
  contents: read

jobs:
  unsigned-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test and build without signing
        run: bash BarkMac/scripts/unsigned-build.sh
